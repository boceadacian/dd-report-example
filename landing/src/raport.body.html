<main class="dd-main dd-report-main">
<div class="dd-card dd-report">
    <h1 class="dd-title">Raportul tău de verificare</h1>
    <p id="report-status">Se încarcă raportul...</p>
    <div class="dd-actions dd-report-actions" id="report-actions" hidden>
        {{BTN:primary:report-download:button:Descarcă PDF}}
        {{BTN:secondary:report-open:button:Deschide în fereastră nouă}}
    </div>
    <p class="dd-report-note" id="report-note" hidden></p>
</div>
<iframe class="dd-report-frame" id="report-frame" title="Raport" hidden></iframe>
</main>
